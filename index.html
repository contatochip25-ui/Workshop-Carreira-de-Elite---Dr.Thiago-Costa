
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Dr. Thiago Costa - Carreira Médica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin crossOrigin="">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #F5F5F5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .font-serif {
            font-family: 'Cormorant Garamond', serif;
        }
        /* Dourado atualizado para #F4C542 para maior contraste e brilho no mobile */
        .gold-text {
            color: #F4C542;
        }
        .gold-bg {
            background-color: #F4C542;
        }
        .gold-border {
            border-color: #F4C542;
        }
        .gradient-gold {
            background: linear-gradient(135deg, #F4C542 0%, #D4AF37 100%);
        }
        .smooth-shadow {
            box-shadow: 0 10px 40px -10px rgba(244, 197, 66, 0.3);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #1a1a1a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #F4C542;
        }

        .premium-led-btn {
            position: relative;
            padding: 1px;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: rgba(244, 197, 66, 0.3);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .premium-led-btn:active {
            transform: scale(0.97);
        }

        .premium-led-btn::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(
                transparent,
                transparent,
                transparent,
                #F4C542,
                transparent
            );
            animation: rotate-border 3s linear infinite;
        }

        .premium-led-btn-inner {
            position: relative;
            z-index: 1;
            background: #000;
            width: 100%;
            height: 100%;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            color: #F4C542;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.3s ease;
        }

        .premium-led-btn:hover .premium-led-btn-inner {
            background: #F4C542;
            color: #000;
        }

        @keyframes rotate-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Animação Marquee Horizontal - Velocidade reduzida (60s) */
        @keyframes marquee-animation {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee-flow {
            display: flex;
            width: max-content;
            animation: marquee-animation 60s linear infinite;
        }
        
        @media (max-width: 640px) {
            .premium-led-btn {
                width: 100%;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",

    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>

</html>
