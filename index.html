
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Dr. Thiago Costa - Carreira Médica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin crossOrigin="">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #e5e5e5;
            overflow-x: hidden;
        }
        .font-serif {
            font-family: 'Cormorant Garamond', serif;
        }
        .gold-text {
            color: #d4af37;
        }
        .gold-bg {
            background-color: #d4af37;
        }
        .gold-border {
            border-color: #d4af37;
        }
        .gradient-gold {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
        }
        .smooth-shadow {
            box-shadow: 0 10px 40px -10px rgba(212, 175, 55, 0.3);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #1a1a1a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d4af37;
        }

        /* LED Button Animation Styles */
        .premium-led-btn {
            position: relative;
            padding: 1.5px;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: rgba(212, 175, 55, 0.1);
            transition: transform 0.3s ease;
        }

        .premium-led-btn:active {
            transform: scale(0.96);
        }

        .premium-led-btn::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent,
                transparent,
                transparent,
                #d4af37,
                transparent
            );
            animation: rotate-border 4s linear infinite;
        }

        .premium-led-btn-inner {
            position: relative;
            z-index: 1;
            background: #000;
            width: 100%;
            height: 100%;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            color: #d4af37;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
        }

        .premium-led-btn:hover .premium-led-btn-inner {
            background: #d4af37;
            color: #000;
        }

        .premium-led-btn:hover::before {
            animation-duration: 1.5s;
            background: conic-gradient(
                #fff,
                #d4af37,
                #fff,
                #d4af37,
                #fff
            );
        }

        @keyframes rotate-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
